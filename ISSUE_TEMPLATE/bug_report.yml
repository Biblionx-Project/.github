name: Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not use this form. Use "Report a vulnerability" in the Security tab instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the input text, if relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release or commit of the affected repository.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser or runtime versions.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Do not include personal data or secrets.
